[project]
name = "portdues"
version = "0.1.0"
description = "Port tariff compiler and disbursement agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=3.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.10",
    "langchain>=1.4",
    "langchain-openai>=1.7",
    "langgraph>=1.2",
    "langfuse>=4.0",
    "qdrant-client>=1.19",
    "psycopg[binary,pool]>=3.2",
    "pymupdf>=1.28",
]

[project.optional-dependencies]
laya = ["laya>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
portdues = "portdues.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portdues"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
